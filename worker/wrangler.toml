name = "khula-portfolio-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

# Secrets used at runtime (set with `wrangler secret put <KEY>` for production,
# or in .dev.vars for local development):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_ANON_KEY

# Serve the Vite-built SPA from the dist/ folder when deployed together.
# Uncomment and adjust if using Workers + static assets together:
# [assets]
# directory = "../dist"
